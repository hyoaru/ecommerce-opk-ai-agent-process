[project]
name = "ecommerce-opk-process"
requires-python = ">= 3.10"
dependencies = [
    "pydantic-ai-slim[openai] (>=0.0.22,<0.0.23)",
    "pydantic (>=2.10.6,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "jupyter-lsp (>=2.2.5,<3.0.0)",
    "python-lsp-server (>=1.12.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false